catalogMode: prefer

shellEmulator: true

trustPolicy: off
packages:
  - packages/*
  - examples/*
# @unocss/webpack@66.8+ 的 CJS 产物用 node-mode interop 加载 ESM-only 的 magic-string@1.x，
# 在 Node 的 require(esm) 下把命名空间当作 default，Taro webpack 构建报
# "magic_string.default is not a constructor"。patch 去掉 node-mode 标志，改读命名空间
# 真实的 .default；背景见 COMPATIBILITY.md，上游修复后删除本条目与 patches/。
patchedDependencies:
  '@unocss/webpack@66.10.0': patches/@unocss__webpack@66.10.0.patch
